ill="#4fd6ff" opacity="0.7"/><rect x="280" y="361" width="20" height="19" rx="4" fill="#4fd6ff" opacity="0.7"/><rect x="310" y="359" width="20" height="21" rx="4" fill="#4fd6ff" opacity="0.7"/><rect x="340" y="363" width="20" height="17" rx="4" fill="#4fd6ff" opacity="0.7"/><rect x="370" y="357" width="20" height="23" rx="4" fill="#4fd6ff" opacity="0.7"/><rect x="400" y="360" width="20" height="20" rx="4" fill="#4fd6ff" opacity="0.7"/><rect x="430" y="230" width="20" height="150" rx="4" fill="#ff6b7a" opacity="1"/><rect x="460" y="358" width="20" height="22" rx="4" fill="#4fd6ff" opacity="0.7"/><rect x="490" y="362" width="20" height="18" rx="4" fill="#4fd6ff" opacity="0.7"/><rect x="520" y="360" width="20" height="20" rx="4" fill="#4fd6ff" opacity="0.7"/><line x1="120" y1="381" x2="560" y2="381" stroke="#2f2f66" stroke-width="1.5" stroke-linecap="round" opacity="1"/><line x1="120" y1="352" x2="560" y2="352" stroke="#5be3a0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 6" opacity="1"/><text x="130" y="344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5be3a0" text-anchor="start" opacity="1">usual range</text><text x="440" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#ff6b7a" text-anchor="middle" opacity="1">40× its usual volume</text><text x="606" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#a6a6c8" text-anchor="start" opacity="1">Why</text><circle cx="610" cy="276" r="4" fill="#ffc857" opacity="1"/><text x="624" y="281" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#e9e9f7" text-anchor="start" opacity="1">An address it never used</text><circle cx="610" cy="310" r="4" fill="#ffc857" opacity="1"/><text x="624" y="315" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#e9e9f7" text-anchor="start" opacity="1">Normally silent at night</text><circle cx="610" cy="344" r="4" fill="#ff6b7a" opacity="1"/><text x="624" y="349" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#e9e9f7" text-anchor="start" opacity="1">Matches a known-bad pattern</text><rect x="130" y="440" width="150" height="38" rx="9" fill="url(#brand)" opacity="1"/><text x="205.0" y="465" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">Keep blocking</text><rect x="294" y="440" width="180" height="38" rx="9" fill="#1b1b4a" stroke="#2f2f66" stroke-width="1.3" opacity="1"/><text x="384.0" y="465" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#e9e9f7" text-anchor="middle" opacity="1">It was me, allow it</text><text x="850" y="466" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#a6a6c8" text-anchor="end" opacity="1">explained, not just blocked</text></svg>
