<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fd6ff"/><stop offset=".6" stop-color="#8b6cf6"/><stop offset="1" stop-color="#ff6fc1"/></linearGradient>
<linearGradient id="poster1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd6ff"/><stop offset="1" stop-color="#8b6cf6"/></linearGradient>
<linearGradient id="poster2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fc1"/><stop offset="1" stop-color="#8b6cf6"/></linearGradient>
<linearGradient id="poster3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2b2b7a"/><stop offset="1" stop-color="#4fd6ff"/></linearGradient>
<linearGradient id="poster4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc857"/><stop offset="1" stop-color="#ff6fc1"/></linearGradient>
<radialGradient id="g0"><stop offset="0" stop-color="#4fd6ff" stop-opacity=".22"/><stop offset="1" stop-color="#4fd6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#ff6fc1" stop-opacity=".2"/><stop offset="1" stop-color="#ff6fc1" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#8b6cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b6cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="g3"><stop offset="0" stop-color="#8b6cf6" stop-opacity=".2"/><stop offset="1" stop-color="#8b6cf6" stop-opacity="0"/></radialGradient>
</defs><rect width="960" height="600" rx="22" fill="url(#bg)"/><circle cx="200" cy="500" r="300" fill="url(#g3)"/><circle cx="170" cy="110" r="260" fill="url(#g0)"/><ellipse cx="480.0" cy="300.0" rx="454" ry="222" fill="none" stroke="#8b6cf6" stroke-width="1" opacity=".22" transform="rotate(-12 480.0 300.0)"/><ellipse cx="480.0" cy="300.0" rx="360" ry="300" fill="none" stroke="#4fd6ff" stroke-width="1" opacity=".14" transform="rotate(-7 480.0 300.0)"/><rect x="106" y="60" width="760" height="500" rx="16" fill="#000000" opacity="0.35"/><rect x="100" y="50" width="760" height="500" rx="16" fill="#12122e" stroke="#2f2f66" stroke-width="1.5" opacity="1"/><line x1="100" y1="90" x2="860" y2="90" stroke="#2f2f66" stroke-width="1.5" stroke-linecap="round" opacity="1"/><circle cx="122" cy="70" r="5" fill="#ff6b7a" opacity="1"/><circle cx="140" cy="70" r="5" fill="#ffc857" opacity="1"/><circle cx="158" cy="70" r="5" fill="#5be3a0" opacity="1"/><text x="480.0" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#a6a6c8" text-anchor="middle" opacity="1">Ask before you buy</text><rect x="430" y="110" width="400" height="42" rx="14" fill="url(#brand)" opacity="0.95"/><text x="444" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start" opacity="1">Should I buy the 1,200 laptop now?</text><rect x="130" y="172" width="620" height="330" rx="16" fill="#16163c" stroke="#4fd6ff" stroke-width="1.6" opacity="1"/><text x="154" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#e9e9f7" text-anchor="start" opacity="1">Wait about six weeks</text><text x="154" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a6a6c8" text-anchor="start" opacity="1">Here is the working, from your own numbers.</text><text x="154" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ff6b7a" text-anchor="start" opacity="1">THIS MONTH</text><text x="274" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e9e9f7" text-anchor="start" opacity="1">It would leave 310 before the car loan payment on the 28th.</text><line x1="154" y1="284" x2="726" y2="284" stroke="#2f2f66" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="154" y="314" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffc857" text-anchor="start" opacity="1">YOUR GOALS</text><text x="274" y="314" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e9e9f7" text-anchor="start" opacity="1">Your emergency fund is at 2.4 months; you set 3.</text><line x1="154" y1="330" x2="726" y2="330" stroke="#2f2f66" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="154" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#5be3a0" text-anchor="start" opacity="1">COST PER USE</text><text x="274" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e9e9f7" text-anchor="start" opacity="1">About 0.80 a day over four years. Reasonable for work.</text><line x1="154" y1="376" x2="726" y2="376" stroke="#2f2f66" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="154" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#4fd6ff" text-anchor="start" opacity="1">IF YOU WAIT</text><text x="274" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e9e9f7" text-anchor="start" opacity="1">After the bonus on the 15th it fits without touching savings.</text><line x1="154" y1="422" x2="726" y2="422" stroke="#2f2f66" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="154" y="448" width="150" height="38" rx="9" fill="url(#brand)" opacity="1"/><text x="229.0" y="473" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">Remind me then</text><rect x="316" y="448" width="190" height="38" rx="9" fill="#1b1b4a" stroke="#2f2f66" stroke-width="1.3" opacity="1"/><text x="411.0" y="473" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#e9e9f7" text-anchor="middle" opacity="1">Show cheaper options</text><text x="726" y="472" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#a6a6c8" text-anchor="end" opacity="1">explains; never decides for you</text></svg>
