, sans-serif" font-size="14.5" font-weight="600" fill="#e9e9f7" text-anchor="start" opacity="1">06:30   mail · list headers</text><text x="856" y="285.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#ffc857" text-anchor="end" opacity="1">skipped: not allowed unattended</text><rect x="430" y="314" width="440" height="44" rx="9" fill="#1b1b4a" stroke="#2f2f66" stroke-width="1" opacity="1"/><text x="444" y="341.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e9e9f7" text-anchor="start" opacity="1">06:30   news · fetch</text><text x="856" y="341.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#ffc857" text-anchor="end" opacity="1">skipped: not allowed unattended</text><rect x="430" y="370" width="440" height="44" rx="9" fill="#1b1b4a" stroke="#2f2f66" stroke-width="1" opacity="1"/><text x="444" y="397.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e9e9f7" text-anchor="start" opacity="1">06:31   briefing saved, one notification</text><rect x="430" y="440" width="247.68000000000004" height="26" rx="13.0" fill="#0b0b1f" stroke="#a6a6c8" stroke-width="1.2" opacity="1"/><text x="441" y="456" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#a6a6c8" text-anchor="start" opacity="1">every line is in your audit log</text></svg>
