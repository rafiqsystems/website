harray="6 6" opacity="1"/><polygon points="386,340 373.5,339.5 378.8,350.2" fill="#a6a6c8"/><line x1="574" y1="340" x2="686.1291503726736" y2="395.1454837898395" stroke="#8b6cf6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" opacity="1"/><polygon points="696,400 688.8,389.8 683.5,400.5" fill="#8b6cf6"/><rect x="250" y="474" width="460" height="100" rx="16" fill="#1b1b4a" stroke="#4fd6ff" stroke-width="1.5" opacity="1"/><text x="274" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4fd6ff" text-anchor="start" opacity="1">Suggestion</text><text x="274" y="534" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="600" fill="#e9e9f7" text-anchor="start" opacity="1">Run the dishwasher at 13:00, when solar peaks.</text><text x="274" y="558" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a6a6c8" text-anchor="start" opacity="1">In an outage: fridge, router and lights for 9 hours.</text><circle cx="325" cy="235" r="5" fill="none" stroke="#ffc857" stroke-width="2"><animate attributeName="r" values="5;12.0" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle><circle cx="325" cy="235" r="5" fill="#ffc857" opacity="1"/></svg>
