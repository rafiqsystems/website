e9e9f7" text-anchor="start" opacity="1">Here is the short version:</text><text x="154" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#e9e9f7" text-anchor="start" opacity="1">• Budget approved for the spring term</text><text x="154" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#e9e9f7" text-anchor="start" opacity="1">• Field trip moved to the 14th</text><text x="154" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#e9e9f7" text-anchor="start" opacity="1">• New timetable goes out on Monday</text><rect x="156" y="324" width="9" height="16" rx="2" fill="#4fd6ff"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect><rect x="140" y="460" width="94.80000000000001" height="26" rx="13.0" fill="#0b0b1f" stroke="#4fd6ff" stroke-width="1.2" opacity="1"/><text x="151" y="476" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#4fd6ff" text-anchor="start" opacity="1">gemma-3-4b</text><rect x="242.8" y="460" width="153.04000000000002" height="26" rx="13.0" fill="#0b0b1f" stroke="#5be3a0" stroke-width="1.2" opacity="1"/><text x="253.8" y="476" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#5be3a0" text-anchor="start" opacity="1">ran on this device</text><rect x="403.84000000000003" y="460" width="211.28000000000003" height="26" rx="13.0" fill="#0b0b1f" stroke="#a6a6c8" stroke-width="1.2" opacity="1"/><text x="414.84000000000003" y="476" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#a6a6c8" text-anchor